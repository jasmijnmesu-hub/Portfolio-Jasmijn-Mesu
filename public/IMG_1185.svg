<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <!-- Background Gradient and Bokeh -->
    <radialGradient id="bgGlow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#CBBCA5" />
      <stop offset="35%" stop-color="#A5947E" />
      <stop offset="70%" stop-color="#736150" />
      <stop offset="100%" stop-color="#483B32" />
    </radialGradient>
    <radialGradient id="bokeh1" cx="30%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#EEDAC0" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#CBBCA5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bokeh2" cx="80%" cy="40%" r="40%">
      <stop offset="0%" stop-color="#A85744" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#736150" stop-opacity="0"/>
    </radialGradient>

    <!-- Face and skin tone gradients -->
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE3D1"/>
      <stop offset="40%" stop-color="#F9D4BD"/>
      <stop offset="85%" stop-color="#EEBEA0"/>
      <stop offset="100%" stop-color="#DE9F7D"/>
    </linearGradient>
    <radialGradient id="blush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E58B79" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#F9D4BD" stop-opacity="0"/>
    </radialGradient>

    <!-- Hair gradient -->
    <linearGradient id="hair" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#FBE6B6"/>
      <stop offset="25%" stop-color="#E8C98F"/>
      <stop offset="60%" stop-color="#CE9F5D"/>
      <stop offset="100%" stop-color="#9C6B31"/>
    </linearGradient>
    <linearGradient id="hairHighlight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFF3D4"/>
      <stop offset="50%" stop-color="#F5D89D"/>
      <stop offset="100%" stop-color="#D7A965"/>
    </linearGradient>

    <!-- Blazer gradient -->
    <linearGradient id="blazer" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%" stop-color="#363A40"/>
      <stop offset="40%" stop-color="#24272B"/>
      <stop offset="100%" stop-color="#141618"/>
    </linearGradient>
    <linearGradient id="lapel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#464A50"/>
      <stop offset="100%" stop-color="#1E2024"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#bgGlow)"/>
  <circle cx="200" cy="150" r="180" fill="url(#bokeh1)"/>
  <circle cx="650" cy="300" r="160" fill="url(#bokeh2)"/>
  <circle cx="150" cy="500" r="140" fill="url(#bokeh2)"/>

  <!-- Back Hair -->
  <path d="M 230 300 C 210 450, 220 580, 240 680 C 300 690, 500 690, 560 680 C 580 580, 590 450, 570 300 Z" fill="url(#hair)"/>

  <!-- Neck & Chest -->
  <path d="M 330 460 L 330 570 C 360 590, 440 590, 470 570 L 470 460 Z" fill="url(#skin)"/>
  <!-- Neck shadow -->
  <path d="M 345 460 C 380 500, 420 500, 455 460 C 420 485, 380 485, 345 460 Z" fill="#C98668" opacity="0.4"/>

  <!-- White Crewneck Undershirt -->
  <path d="M 330 550 C 370 585, 430 585, 470 550 L 485 620 C 435 640, 365 640, 315 620 Z" fill="#F4F4F6"/>
  <path d="M 335 558 C 375 588, 425 588, 465 558" stroke="#E1E1E5" stroke-width="4" fill="none"/>

  <!-- Charcoal/Black Blazer Body -->
  <path d="M 170 800 L 220 600 C 260 580, 330 560, 350 560 L 400 780 L 450 560 C 470 560, 540 580, 580 600 L 630 800 Z" fill="url(#blazer)"/>

  <!-- Blazer Lapels -->
  <path d="M 270 570 L 370 700 L 350 780 L 220 620 Z" fill="url(#lapel)"/>
  <path d="M 530 570 L 430 700 L 450 780 L 580 620 Z" fill="url(#lapel)"/>
  <!-- Lapel edges and button -->
  <path d="M 370 700 L 400 800 L 430 700" stroke="#101114" stroke-width="3" fill="none"/>

  <!-- Face Shape (Oval with soft chin, tilted slightly) -->
  <path d="M 285 320 C 275 430, 310 505, 400 505 C 490 505, 525 430, 515 320 C 510 210, 480 180, 400 180 C 320 180, 290 210, 285 320 Z" fill="url(#skin)"/>

  <!-- Cheeks Blush -->
  <ellipse cx="335" cy="385" rx="35" ry="25" fill="url(#blush)"/>
  <ellipse cx="465" cy="385" rx="35" ry="25" fill="url(#blush)"/>

  <!-- Eyebrows (Natural blonde / light brown) -->
  <path d="M 315 295 C 335 285, 360 288, 375 298" stroke="#B88A58" stroke-width="5.5" stroke-linecap="round" fill="none"/>
  <path d="M 425 298 C 440 288, 465 285, 485 295" stroke="#B88A58" stroke-width="5.5" stroke-linecap="round" fill="none"/>

  <!-- Eyes (Bright Blue) -->
  <!-- Left Eye -->
  <ellipse cx="345" cy="325" rx="20" ry="12" fill="#FFFFFF"/>
  <ellipse cx="346" cy="325" rx="10" ry="10" fill="#4A7C9B"/>
  <ellipse cx="346" cy="325" rx="5" ry="5" fill="#1C2E3D"/>
  <circle cx="343" cy="322" r="3" fill="#FFFFFF"/>
  <path d="M 322 322 C 335 312, 358 312, 368 322" stroke="#3D2B2F" stroke-width="2.5" fill="none"/>

  <!-- Right Eye -->
  <ellipse cx="455" cy="325" rx="20" ry="12" fill="#FFFFFF"/>
  <ellipse cx="454" cy="325" rx="10" ry="10" fill="#4A7C9B"/>
  <ellipse cx="454" cy="325" rx="5" ry="5" fill="#1C2E3D"/>
  <circle cx="451" cy="322" r="3" fill="#FFFFFF"/>
  <path d="M 432 322 C 442 312, 465 312, 478 322" stroke="#3D2B2F" stroke-width="2.5" fill="none"/>

  <!-- Nose -->
  <path d="M 400 315 L 398 375 C 392 385, 408 385, 402 375" stroke="#D39678" stroke-width="3" stroke-linecap="round" fill="none"/>
  <ellipse cx="390" cy="382" rx="4" ry="2.5" fill="#C58567"/>
  <ellipse cx="410" cy="382" rx="4" ry="2.5" fill="#C58567"/>

  <!-- Smile (Warm open smile showing white teeth) -->
  <path d="M 350 415 C 375 410, 425 410, 450 415 C 455 425, 440 455, 400 455 C 360 455, 345 425, 350 415 Z" fill="#9C3A35"/>
  <!-- Teeth -->
  <path d="M 355 418 C 375 416, 425 416, 445 418 C 440 432, 420 435, 400 435 C 380 435, 360 432, 355 418 Z" fill="#FFFFFF"/>
  <!-- Lower lip highlight -->
  <path d="M 370 455 C 390 462, 410 462, 430 455" stroke="#E58B79" stroke-width="3.5" stroke-linecap="round" fill="none"/>

  <!-- Gold Hoop Earrings with Accents -->
  <ellipse cx="280" cy="380" rx="6" ry="18" fill="none" stroke="#D3A24C" stroke-width="4"/>
  <circle cx="280" cy="392" r="3.5" fill="#B3543C"/>
  <ellipse cx="520" cy="380" rx="6" ry="18" fill="none" stroke="#D3A24C" stroke-width="4"/>
  <circle cx="520" cy="392" r="3.5" fill="#B3543C"/>

  <!-- Front Flowing Blonde Hair -->
  <!-- Left Side flowing hair -->
  <path d="M 390 180 C 310 180, 240 230, 230 360 C 220 460, 235 560, 280 640 C 295 620, 305 570, 295 500 C 285 430, 285 360, 320 280 C 350 220, 380 190, 390 180 Z" fill="url(#hairHighlight)"/>
  
  <!-- Right Side flowing hair -->
  <path d="M 405 180 C 475 180, 545 230, 565 350 C 585 450, 570 560, 530 650 C 510 630, 495 570, 505 500 C 515 430, 515 350, 475 275 C 445 220, 415 190, 405 180 Z" fill="url(#hair)"/>

  <!-- Hair Strands & Volume Texture -->
  <path d="M 360 185 C 300 230, 260 320, 255 420" stroke="#FCE7B9" stroke-width="3" fill="none" opacity="0.7"/>
  <path d="M 425 185 C 490 230, 535 320, 545 430" stroke="#FFF2D1" stroke-width="3.5" fill="none" opacity="0.8"/>
  <path d="M 395 180 C 375 220, 345 260, 310 320" stroke="#DFC082" stroke-width="3" fill="none" opacity="0.6"/>
</svg>